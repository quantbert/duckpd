[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "duckpd"
version = "0.1.3"
description = "A lazy pandas-shaped DataFrame powered by DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "QuantBert" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.5,<1.6",
    "pandas>=3.0,<3.1",
    "pyarrow>=18",
]

[project.urls]
Homepage = "https://github.com/quantbert/duckpd"
Repository = "https://github.com/quantbert/duckpd"
Issues = "https://github.com/quantbert/duckpd/issues"
Changelog = "https://github.com/quantbert/duckpd/blob/main/docs/CHANGELOG.md"

[project.entry-points."narwhals.plugins"]
duckpd = "duckpd._narwhals_plugin"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pandas-stubs>=3.0",
    "narwhals>=2.17,<3",
    "pre-commit>=4.0",
    "pyarrow-stubs>=20.0.0.20260625",
    "pyright>=1.1.400",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/duckpd"]

[tool.pyright]
include = ["benchmark", "demo", "src", "tests"]
pythonVersion = "3.11"
reportPrivateUsage = false
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=duckpd",
    "--cov-report=term-missing",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["duckpd"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
